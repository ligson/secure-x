name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.41.7
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

jobs:
  build-backend:
    name: Backend ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: macos-amd64
            goos: darwin
            goarch: amd64
          - target: macos-arm64
            goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: securex-be/go.mod
          cache-dependency-path: securex-be/go.sum

      - name: Test backend
        working-directory: securex-be
        run: go test ./...

      - name: Build backend
        working-directory: securex-be
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package_dir="dist/securex-be-${version}-${{ matrix.target }}"
          mkdir -p "$package_dir"
          go build -trimpath -ldflags="-s -w" -o "$package_dir/secure-x" ./cmd/server
          cp config.example.yaml "$package_dir/config.example.yaml"
          cp README.md "$package_dir/README.md"
          cp deploy/start.sh "$package_dir/start.sh"
          cp deploy/stop.sh "$package_dir/stop.sh"
          cp deploy/status.sh "$package_dir/status.sh"
          cp deploy/secure-x.service "$package_dir/secure-x.service"
          chmod +x "$package_dir/start.sh" "$package_dir/stop.sh" "$package_dir/status.sh" "$package_dir/secure-x"
          tar -C dist -czf "dist/securex-be-${version}-${{ matrix.target }}.tar.gz" "$(basename "$package_dir")"

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: securex-be-${{ matrix.target }}
          path: securex-be/dist/*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Flutter Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Get dependencies
        working-directory: securex-app
        run: flutter pub get

      - name: Build Windows
        working-directory: securex-app
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $parts = $version.Split('.')
          if ($parts.Length -ne 3) {
            throw "Invalid release tag version: $version"
          }
          $buildNumber = ([int]$parts[0] * 10000 + [int]$parts[1] * 100 + [int]$parts[2])
          flutter build windows --release --build-name "$version" --build-number "$buildNumber"

      - name: Package Windows
        working-directory: securex-app
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/securex-app-$version-windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: securex-app-windows-x64
          path: securex-app/dist/*.zip
          if-no-files-found: error

  build-macos:
    name: Flutter macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Get dependencies
        working-directory: securex-app
        run: flutter pub get

      - name: Build macOS
        working-directory: securex-app
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          IFS='.' read -r major minor patch <<<"$version"
          build_number=$((major * 10000 + minor * 100 + patch))
          flutter build macos --release --build-name "$version" --build-number "$build_number"

      - name: Package macOS
        working-directory: securex-app
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          app_path=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app_path" ]; then
            echo 'macOS app bundle not found.' >&2
            exit 1
          fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "dist/securex-app-${version}-macos-${{ matrix.arch }}.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: securex-app-macos-${{ matrix.arch }}
          path: securex-app/dist/*.zip
          if-no-files-found: error

  build-android:
    name: Flutter Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Get dependencies
        working-directory: securex-app
        run: flutter pub get

      - name: Build Android APK and App Bundle
        working-directory: securex-app
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          IFS='.' read -r major minor patch <<<"$version"
          build_number=$((major * 10000 + minor * 100 + patch))
          flutter build apk --release --build-name "$version" --build-number "$build_number"
          flutter build appbundle --release --build-name "$version" --build-number "$build_number"

      - name: Package Android
        working-directory: securex-app
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/securex-app-${version}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/securex-app-${version}-android.aab"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: securex-app-android
          path: |
            securex-app/dist/*.apk
            securex-app/dist/*.aab
          if-no-files-found: error

  build-ios:
    name: Flutter iOS unsigned
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Get dependencies
        working-directory: securex-app
        run: flutter pub get

      - name: Build iOS without code signing
        working-directory: securex-app
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          IFS='.' read -r major minor patch <<<"$version"
          build_number=$((major * 10000 + minor * 100 + patch))
          flutter build ios --release --no-codesign --build-name "$version" --build-number "$build_number"

      - name: Package iOS app bundle
        working-directory: securex-app
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          app_path="build/ios/iphoneos/Runner.app"
          if [ ! -d "$app_path" ]; then
            echo 'iOS Runner.app not found.' >&2
            exit 1
          fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "dist/securex-app-${version}-ios-unsigned.zip"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: securex-app-ios-unsigned
          path: securex-app/dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-windows
      - build-macos
      - build-android
      - build-ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Validate release tag matches checked out commit
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Release tag ${tag} does not exist in the checked out repository." >&2
            exit 1
          fi
          checked_out_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 "$tag")"
          if [ "$checked_out_commit" != "$tag_commit" ]; then
            echo "Checked out commit ${checked_out_commit} does not match tag ${tag} -> ${tag_commit}." >&2
            echo "Please rerun the workflow against the exact release tag commit." >&2
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract changelog section for tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          awk -v tag="$tag" '
            /^## / {
              if (started) exit
              if ($0 ~ "^## \\[" tag "\\]") started=1
            }
            started { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "Failed to extract changelog section for ${tag} from CHANGELOG.md." >&2
            echo "Expected heading format: ## [${tag}] - YYYY-MM-DD" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"
          mapfile -t assets < <(find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' -o -name '*.aab' \) | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo 'No release assets found.' >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "Secure X ${tag}" \
              --notes-file release_notes.md
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            target_commit="$(git rev-list -n 1 "$tag")"
            gh release create "$tag" "${assets[@]}" \
              --target "$target_commit" \
              --title "Secure X ${tag}" \
              --notes-file release_notes.md
          fi

          echo "Published Secure X ${version} with ${#assets[@]} assets."
