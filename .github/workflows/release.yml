name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.41.7
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

jobs:
  build-backend:
    name: Backend ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: macos-amd64
            goos: darwin
            goarch: amd64
          - target: macos-arm64
            goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: securex-be/go.mod
          cache-dependency-path: securex-be/go.sum

      - name: Test backend
        working-directory: securex-be
        run: go test ./...

      - name: Build backend
        working-directory: securex-be
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package_dir="dist/securex-be-${version}-${{ matrix.target }}"
          mkdir -p "$package_dir"
          go build -trimpath -ldflags="-s -w" -o "$package_dir/secure-x" ./cmd/server
          cp config.example.yaml "$package_dir/config.example.yaml"
          cp README.md "$package_dir/README.md"
          cp deploy/start.sh "$package_dir/start.sh"
          cp deploy/stop.sh "$package_dir/stop.sh"
          cp deploy/status.sh "$package_dir/status.sh"
          cp deploy/secure-x.service "$package_dir/secure-x.service"
          chmod +x "$package_dir/start.sh" "$package_dir/stop.sh" "$package_dir/status.sh" "$package_dir/secure-x"
          tar -C dist -czf "dist/securex-be-${version}-${{ matrix.target }}.tar.gz" "$(basename "$package_dir")"

      - name: Upload backend artifact
        id: upload_backend_artifact_1
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: securex-be-${{ matrix.target }}
          path: securex-be/dist/*.tar.gz
          if-no-files-found: error
          overwrite: true

      - name: Retry upload backend artifact
        if: steps.upload_backend_artifact_1.outcome == 'failure'
        id: upload_backend_artifact_2
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: securex-be-${{ matrix.target }}
          path: securex-be/dist/*.tar.gz
          if-no-files-found: error
          overwrite: true

      - name: Final retry upload backend artifact
        if: steps.upload_backend_artifact_1.outcome == 'failure' && steps.upload_backend_artifact_2.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: securex-be-${{ matrix.target }}
          path: securex-be/dist/*.tar.gz
          if-no-files-found: error
          overwrite: true

  build-windows:
    name: Flutter Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.9.1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Get dependencies
        working-directory: securex-app
        run: flutter pub get

      - name: Build Windows
        working-directory: securex-app
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $parts = $version.Split('.')
          if ($parts.Length -ne 3) {
            throw "Invalid release tag version: $version"
          }
          $buildNumber = ([int]$parts[0] * 10000 + [int]$parts[1] * 100 + [int]$parts[2])
          flutter build windows --release --build-name "$version" --build-number "$buildNumber"

      - name: Package Windows
        working-directory: securex-app
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/securex-app-$version-windows-x64.zip" -Force

      - name: Upload Windows artifact
        id: upload_windows_artifact_1
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: securex-app-windows-x64
          path: securex-app/dist/*.zip
          if-no-files-found: error
          overwrite: true

      - name: Retry upload Windows artifact
        if: steps.upload_windows_artifact_1.outcome == 'failure'
        id: upload_windows_artifact_2
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: securex-app-windows-x64
          path: securex-app/dist/*.zip
          if-no-files-found: error
          overwrite: true

      - name: Final retry upload Windows artifact
        if: steps.upload_windows_artifact_1.outcome == 'failure' && steps.upload_windows_artifact_2.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: securex-app-windows-x64
          path: securex-app/dist/*.zip
          if-no-files-found: error
          overwrite: true

  build-macos:
    name: Flutter macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.9.1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Get dependencies
        working-directory: securex-app
        run: flutter pub get

      - name: Build macOS
        working-directory: securex-app
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          IFS='.' read -r major minor patch <<<"$version"
          build_number=$((major * 10000 + minor * 100 + patch))
          flutter build macos --release --build-name "$version" --build-number "$build_number"

      - name: Package macOS
        working-directory: securex-app
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          app_path=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app_path" ]; then
            echo 'macOS app bundle not found.' >&2
            exit 1
          fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "dist/securex-app-${version}-macos-${{ matrix.arch }}.zip"

      - name: Upload macOS artifact
        id: upload_macos_artifact_1
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: securex-app-macos-${{ matrix.arch }}
          path: securex-app/dist/*.zip
          if-no-files-found: error
          overwrite: true

      - name: Retry upload macOS artifact
        if: steps.upload_macos_artifact_1.outcome == 'failure'
        id: upload_macos_artifact_2
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: securex-app-macos-${{ matrix.arch }}
          path: securex-app/dist/*.zip
          if-no-files-found: error
          overwrite: true

      - name: Final retry upload macOS artifact
        if: steps.upload_macos_artifact_1.outcome == 'failure' && steps.upload_macos_artifact_2.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: securex-app-macos-${{ matrix.arch }}
          path: securex-app/dist/*.zip
          if-no-files-found: error
          overwrite: true

  build-android:
    name: Flutter Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.9.1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Get dependencies
        working-directory: securex-app
        run: flutter pub get

      - name: Prepare Android signing
        working-directory: securex-app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo 'ANDROID_KEYSTORE_BASE64 is not configured; Android release will use the local debug signing fallback.'
            exit 0
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo 'Android signing secrets are incomplete.' >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/securex-release.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=../securex-release.jks\n'
          } > android/key.properties

      - name: Build Android APK and App Bundle
        working-directory: securex-app
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          IFS='.' read -r major minor patch <<<"$version"
          build_number=$((major * 10000 + minor * 100 + patch))
          flutter build apk --release --build-name "$version" --build-number "$build_number"
          flutter build appbundle --release --build-name "$version" --build-number "$build_number"

      - name: Package Android
        working-directory: securex-app
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/securex-app-${version}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/securex-app-${version}-android.aab"

      - name: Upload Android APK to PGYER
        working-directory: securex-app
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          PGYER_BUILD_INSTALL_TYPE: ${{ vars.PGYER_BUILD_INSTALL_TYPE || '2' }}
          PGYER_BUILD_PASSWORD: ${{ secrets.PGYER_BUILD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PGYER_API_KEY:-}" ]; then
            echo 'PGYER_API_KEY is not configured; skip Android PGYER upload.'
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          notes="$(awk -v tag="$RELEASE_TAG" '
            /^## / {
              if (started) exit
              if ($0 ~ "^## \\[" tag "\\]") started=1
            }
            started { print }
          ' ../CHANGELOG.md)"
          export PGYER_BUILD_UPDATE_DESCRIPTION="$notes"
          python3 ../scripts/upload-pgyer.py "dist/securex-app-${version}-android.apk"

      - name: Upload Android artifact
        id: upload_android_artifact_1
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: securex-app-android
          path: |
            securex-app/dist/*.apk
            securex-app/dist/*.aab
          if-no-files-found: error
          overwrite: true

      - name: Retry upload Android artifact
        if: steps.upload_android_artifact_1.outcome == 'failure'
        id: upload_android_artifact_2
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: securex-app-android
          path: |
            securex-app/dist/*.apk
            securex-app/dist/*.aab
          if-no-files-found: error
          overwrite: true

      - name: Final retry upload Android artifact
        if: steps.upload_android_artifact_1.outcome == 'failure' && steps.upload_android_artifact_2.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: securex-app-android
          path: |
            securex-app/dist/*.apk
            securex-app/dist/*.aab
          if-no-files-found: error
          overwrite: true

  build-ios:
    name: Flutter iOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.9.1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Get dependencies
        working-directory: securex-app
        run: flutter pub get

      - name: Prepare iOS signing
        working-directory: securex-app
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'ad-hoc' }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${IOS_DISTRIBUTION_CERTIFICATE_BASE64:-}" ]; then
            echo 'IOS_SIGNING_READY=false' >> "$GITHUB_ENV"
            echo 'iOS signing secrets are not configured; build unsigned iOS bundle.'
            exit 0
          fi
          if [ -z "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:-}" ] || [ -z "${IOS_PROVISIONING_PROFILE_BASE64:-}" ] || [ -z "${IOS_TEAM_ID:-}" ]; then
            echo 'iOS signing secrets are incomplete.' >&2
            exit 1
          fi

          cert_path="$RUNNER_TEMP/ios_distribution.p12"
          profile_path="$RUNNER_TEMP/securex.mobileprovision"
          profile_plist="$RUNNER_TEMP/securex-profile.plist"
          keychain_path="$RUNNER_TEMP/securex-signing.keychain-db"
          export CERT_PATH="$cert_path"
          export PROFILE_PATH="$profile_path"

          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["CERT_PATH"]).write_bytes(base64.b64decode(os.environ["IOS_DISTRIBUTION_CERTIFICATE_BASE64"]))'
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["PROFILE_PATH"]).write_bytes(base64.b64decode(os.environ["IOS_PROVISIONING_PROFILE_BASE64"]))'

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$cert_path" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | sed s/\"//g)

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")"
          decoded_profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' "$profile_plist")"
          profile_name="${IOS_PROVISIONING_PROFILE_NAME:-$decoded_profile_name}"
          export PROFILE_NAME="$profile_name"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"

          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          release_xcconfig = Path("ios/Flutter/Release.xcconfig")
          with release_xcconfig.open("a", encoding="utf-8") as handle:
              handle.write("\n")
              handle.write(f"DEVELOPMENT_TEAM={os.environ['IOS_TEAM_ID']}\n")
              handle.write("CODE_SIGN_STYLE=Manual\n")
              handle.write("CODE_SIGN_IDENTITY=Apple Distribution\n")
              handle.write(f"PROVISIONING_PROFILE_SPECIFIER={os.environ['PROFILE_NAME']}\n")

          export_options = {
              "method": os.environ["IOS_EXPORT_METHOD"],
              "teamID": os.environ["IOS_TEAM_ID"],
              "signingStyle": "manual",
              "provisioningProfiles": {
                  "com.ligson.securexApp": os.environ["PROFILE_NAME"],
              },
              "compileBitcode": False,
              "stripSwiftSymbols": True,
          }
          with open("ios/ExportOptions.plist", "wb") as handle:
              plistlib.dump(export_options, handle)
          PY

          echo 'IOS_SIGNING_READY=true' >> "$GITHUB_ENV"

      - name: Build signed iOS IPA
        if: env.IOS_SIGNING_READY == 'true'
        working-directory: securex-app
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          IFS='.' read -r major minor patch <<<"$version"
          build_number=$((major * 10000 + minor * 100 + patch))
          flutter build ipa --release \
            --build-name "$version" \
            --build-number "$build_number" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Build iOS without code signing
        if: env.IOS_SIGNING_READY != 'true'
        working-directory: securex-app
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          IFS='.' read -r major minor patch <<<"$version"
          build_number=$((major * 10000 + minor * 100 + patch))
          flutter build ios --release --no-codesign --build-name "$version" --build-number "$build_number"

      - name: Package signed iOS IPA
        if: env.IOS_SIGNING_READY == 'true'
        working-directory: securex-app
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          ipa_path="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$ipa_path" ]; then
            echo 'Signed iOS IPA not found.' >&2
            exit 1
          fi
          mkdir -p dist
          cp "$ipa_path" "dist/securex-app-${version}-ios.ipa"

      - name: Package iOS app bundle
        if: env.IOS_SIGNING_READY != 'true'
        working-directory: securex-app
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          app_path="build/ios/iphoneos/Runner.app"
          if [ ! -d "$app_path" ]; then
            echo 'iOS Runner.app not found.' >&2
            exit 1
          fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "dist/securex-app-${version}-ios-unsigned.zip"

      - name: Upload iOS IPA to PGYER
        if: env.IOS_SIGNING_READY == 'true'
        working-directory: securex-app
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          PGYER_BUILD_INSTALL_TYPE: ${{ vars.PGYER_BUILD_INSTALL_TYPE || '2' }}
          PGYER_BUILD_PASSWORD: ${{ secrets.PGYER_BUILD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PGYER_API_KEY:-}" ]; then
            echo 'PGYER_API_KEY is not configured; skip iOS PGYER upload.'
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          notes="$(awk -v tag="$RELEASE_TAG" '
            /^## / {
              if (started) exit
              if ($0 ~ "^## \\[" tag "\\]") started=1
            }
            started { print }
          ' ../CHANGELOG.md)"
          export PGYER_BUILD_UPDATE_DESCRIPTION="$notes"
          python3 ../scripts/upload-pgyer.py "dist/securex-app-${version}-ios.ipa"

      - name: Upload iOS artifact
        id: upload_ios_artifact_1
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: securex-app-ios
          path: |
            securex-app/dist/*.ipa
            securex-app/dist/*.zip
          if-no-files-found: error
          overwrite: true

      - name: Retry upload iOS artifact
        if: steps.upload_ios_artifact_1.outcome == 'failure'
        id: upload_ios_artifact_2
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: securex-app-ios
          path: |
            securex-app/dist/*.ipa
            securex-app/dist/*.zip
          if-no-files-found: error
          overwrite: true

      - name: Final retry upload iOS artifact
        if: steps.upload_ios_artifact_1.outcome == 'failure' && steps.upload_ios_artifact_2.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: securex-app-ios
          path: |
            securex-app/dist/*.ipa
            securex-app/dist/*.zip
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-windows
      - build-macos
      - build-android
      - build-ios

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Validate release tag matches checked out commit
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Release tag ${tag} does not exist in the checked out repository." >&2
            exit 1
          fi
          checked_out_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 "$tag")"
          if [ "$checked_out_commit" != "$tag_commit" ]; then
            echo "Checked out commit ${checked_out_commit} does not match tag ${tag} -> ${tag_commit}." >&2
            echo "Please rerun the workflow against the exact release tag commit." >&2
            exit 1
          fi

      - name: Download artifacts
        id: download_artifacts_1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Retry download artifacts
        if: steps.download_artifacts_1.outcome == 'failure'
        id: download_artifacts_2
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Final retry download artifacts
        if: steps.download_artifacts_1.outcome == 'failure' && steps.download_artifacts_2.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract changelog section for tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          awk -v tag="$tag" '
            /^## / {
              if (started) exit
              if ($0 ~ "^## \\[" tag "\\]") started=1
            }
            started { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "Failed to extract changelog section for ${tag} from CHANGELOG.md." >&2
            echo "Expected heading format: ## [${tag}] - YYYY-MM-DD" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"
          mapfile -t assets < <(find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' -o -name '*.aab' -o -name '*.ipa' \) | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo 'No release assets found.' >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "Secure X ${tag}" \
              --notes-file release_notes.md
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            target_commit="$(git rev-list -n 1 "$tag")"
            gh release create "$tag" "${assets[@]}" \
              --target "$target_commit" \
              --title "Secure X ${tag}" \
              --notes-file release_notes.md
          fi

          echo "Published Secure X ${version} with ${#assets[@]} assets."
