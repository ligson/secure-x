server:
  addr: ":8080"
  # 当后端被挂在反向代理子路径下时，可配置外部访问前缀，如 "/securex-be"。
  # 若代理已透传 X-Forwarded-Prefix，则优先使用代理头。
  publicBasePath: ""

database:
  dsn: "data/securex.db"

storage:
  fileDir: "data/files"

logging:
  dir: "logs"
  appFile: "secure-x.log"
  accessFile: "access.log"

auth:
  jwtSecret: "replace-with-a-long-random-secret"

realtime:
  # 图文聊天默认使用 WebSocket + 应用层端到端加密。
  iceServers: []
  livekit:
    # 语音/视频通话媒体链路。未部署 LiveKit 时保持 false。
    enabled: false
    # 示例："wss://rtc.example.com"
    url: ""
    apiKey: ""
    apiSecret: ""
    # 可填写 "turn_udp_5349"、"turn_tls_443" 等记录部署模式，客户端仅用于展示/诊断。
    turnMode: ""
